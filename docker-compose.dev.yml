services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.database
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  backend:
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3333:3333"
  adminer:
    build:
      context: .
      dockerfile: Dockerfile.adminer

volumes:
  db_data:
    driver: local
